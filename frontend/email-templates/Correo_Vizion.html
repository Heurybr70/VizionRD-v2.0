<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva solicitud - VizionRD</title>
</head>
<body style="margin:0;padding:0;background:#15171b;font-family:Arial,Helvetica,sans-serif;color:#f5f7fa;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#15171b;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:36px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:680px;width:100%;">
          <tr>
            <td style="padding:0 0 22px 0;">
              <div style="font-size:26px;font-weight:800;letter-spacing:-1px;color:#ffffff;">
                VIZION<span style="color:#0d8cff;">RD</span>
              </div>
            </td>
          </tr>
          <tr>
            <td style="background:#1f2227;border:1px solid #353941;border-radius:20px;padding:34px 32px;">
              <p style="margin:0 0 8px 0;color:#ffffff;font-size:17px;line-height:1.6;">Hola VizionRD,</p>
              <p style="margin:0 0 28px 0;color:#9aa6b5;font-size:15px;line-height:1.7;">
                Recibiste una nueva solicitud de información de
                <strong style="color:#ffffff;">{{nombre}}</strong>.
              </p>

              <div style="margin:0 0 8px 0;color:#6f8fb9;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;">Asunto</div>
              <h1 style="margin:0 0 28px 0;color:#ffffff;font-size:24px;line-height:1.35;font-weight:800;">{{sujeto}}</h1>

              <div style="margin:0 0 10px 0;color:#6f8fb9;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;">Mensaje del cliente</div>
              <div style="margin:0 0 30px 0;padding:18px 20px;border-left:4px solid #0d8cff;background:#191c21;color:#d8e0e9;font-size:15px;line-height:1.8;white-space:pre-line;">{{Message}}</div>

              <div style="margin:0 0 14px 0;color:#6f8fb9;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;">Datos de contacto</div>
              <p style="margin:0 0 8px 0;color:#d8e0e9;font-size:15px;line-height:1.65;"><strong style="color:#ffffff;">Nombre:</strong> {{nombre}}</p>
              <p style="margin:0 0 8px 0;color:#d8e0e9;font-size:15px;line-height:1.65;">
                <strong style="color:#ffffff;">Correo:</strong>
                <a href="mailto:{{email}}" style="color:#0d8cff;text-decoration:none;">{{email}}</a>
              </p>
              <p style="margin:0;color:#d8e0e9;font-size:15px;line-height:1.65;"><strong style="color:#ffffff;">Teléfono:</strong> {{telefono}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 6px 0 6px;color:#667892;font-size:11px;line-height:1.6;text-align:center;">
              Solicitud recibida desde el formulario web de VizionRD.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
